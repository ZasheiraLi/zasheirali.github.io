<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout | Zasheira Li</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            background: #0a0a0a;
            color: #e5e5e5;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .checkout-box {
            background: #111;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #333;
            max-width: 600px;
        }

        .item {
            padding: 12px 0;
            border-bottom: 1px solid #333;
        }

        .item:last-child {
            border-bottom: none;
        }

        .total {
            font-size: 22px;
            margin-top: 20px;
            font-weight: bold;
        }

        .coupon {
            margin-top: 10px;
            font-size: 18px;
            color: #4caf50;
        }

        button {
            margin-top: 25px;
            padding: 12px 20px;
            background: #4caf50;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }
    </style>
</head>

<body>

<h1>Checkout</h1>
<p>Review your selected services below.</p>

<div class="checkout-box" id="checkoutBox">
    <!-- Dynamic content will load here -->
</div>

<script>
    // -----------------------------
    // PRODUCT DATABASE (editable)
    // -----------------------------
    const PRODUCTS = {
        "xnjmu9wic1": { name: "Device Diagnostics & Troubleshooting — Advanced Diagnostic", price: 40.00 },
        "v94hzffkny": { name: "Network Optimization & Speed Boost — Advanced", price: 50.00 },
        "00joeh0fnc": { name: "API Hosting & Deployment Setup", price: 60.00 },
        "1380lvy91c": { name: "System Optimization & Tuning — Advanced", price: 50.00 },
        "ehwzdm2zh4": { name: "Virus Removal & Security Hardening — Advanced", price: 60.00 },
        "naua2pe2ii": { name: "Computer Skills Coaching (1 Hour) — Advanced", price: 40.00 },
        "a15wwf48jq": { name: "Computer Skills Training (1 Hour) — Basic", price: 25.00 },
        "dx0pf5902o": { name: "Printer & Device Configuration — Advanced", price: 35.00 },
        "k1e1ulsexj": { name: "OS Installation (Windows, macOS, Linux) — Advanced", price: 80.00 },
        "3sht7bsr4m": { name: "OS Installation / Reset (Windows Only) — Basic", price: 50.00 },
        "rqncj638mu": { name: "Smart Home Device Setup (Wi‑Fi Plugs, Cameras, Lights)", price: 50.00 },
        "3rjtwimbb5": { name: "Data Backup Service — Basic", price: 40.00 },
        "z762sk9jgi": { name: "Device Diagnostics & Troubleshooting — Basic Diagnostic", price: 25.00 },
        "dl2x96mtjd": { name: "Cloud Storage Setup (Google Drive / OneDrive / iCloud)", price: 35.00 },
        "s28yiaetb5": { name: "System Speed Boost — Basic", price: 30.00 },
        "nwjolmwzk6": { name: "Data Recovery Service — Advanced", price: 100.00 },
        "hl7fhi24q0": { name: "Software Installation & Configuration", price: 20.00 },
        "7ga4e0266z": { name: "Monthly Tech Support Subscription", price: 30.00 },
        "kvgzs4omg3": { name: "Password Manager Setup & Security Upgrade", price: 30.00 },
        "h5icwvdxmz": { name: "Wi‑Fi & Network Setup — Basic", price: 35.00 },
        "dmfx98sbpz": { name: "Email Setup — Basic", price: 15.00 },
        "3ysmifde7g": { name: "Device Diagnostics & Troubleshooting — Full Diagnostic", price: 60.00 },
        "1r7i6bvk00": { name: "Virus & Malware Removal — Basic", price: 40.00 },
        "gfk0090qs2": { name: "Email Security & Multi‑Device Sync — Advanced", price: 25.00 },
        "gm0lkppjg2": { name: "Printer Setup — Basic", price: 20.00 }
    };

    // -----------------------------
    // URL PARAMETER PARSER
    // -----------------------------
    function getParams() {
        const params = new URLSearchParams(window.location.search);
        return {
            products: params.get("products"),
            coupon: params.get("coupon")
        };
    }

    

    // -----------------------------
    // RENDER CHECKOUT
    // -----------------------------
    function renderCheckout() {
        const box = document.getElementById("checkoutBox");
        const { products, coupon } = getParams();

        if (!products) {
            box.innerHTML = "<p>No products found in checkout URL.</p>";
            return;
        }

        let total = 0;
        let html = "";

        const items = products.split(",");

        items.forEach(entry => {
            const [id, qty] = entry.split(":");
            const product = PRODUCTS[id];

            if (product) {
                const cost = product.price * (parseInt(qty) || 1);
                total += cost;

                html += `
                    <div class="item">
                        <strong>${product.name}</strong><br>
                        Quantity: ${qty}<br>
                        Price: $${product.price} × ${qty} = <strong>$${cost}</strong>
                    </div>
                `;
            }
        });

        // Apply coupon (optional)
        let discount = 0;
        if (coupon === "welcome10") {
            discount = total * 0.10;
            total = total - discount;
            html += `<div class="coupon">Coupon applied: -$${discount.toFixed(2)}</div>`;
        }

        html += `<div class="total">Total: $${total.toFixed(2)}</div>`;
        html += `<button onclick="confirmOrder()">Confirm Request</button>`;

        box.innerHTML = html;
    }

    // -----------------------------
    // CONFIRMATION HANDLER
    // -----------------------------
    function confirmOrder() {
        alert("Your request has been submitted. You will receive a confirmation email shortly.");
    }

    // Initialize checkout
    renderCheckout();
</script>

</body>
</html>
